<button
  type="button"
  class="tema"
  (click)="temaService.alternar()"
  [attr.aria-label]="etiquetaTema()"
  [title]="etiquetaTema()"
>
  @if (temaService.tema() === 'oscuro') {
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <circle cx="12" cy="12" r="4" />
      <path
        d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
      />
    </svg>
  } @else {
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" />
    </svg>
  }
</button>

<main class="stage" [class.stage--leaving]="success()">
  <div
    class="card"
    [class.card--shake]="shake()"
    [class.card--success]="success()"
    role="region"
    aria-labelledby="login-title"
  >
    <div class="brand">
      <span class="brand__logo" role="img" aria-label="Congreso del Estado de México">
        <img src="assets/congreso-edomex-logo.png" alt="" />
        <span class="brand__logo-text" aria-hidden="true"></span>
        <span class="brand__logo-text brand__logo-text--white" aria-hidden="true"></span>
      </span>
      <span class="card__wordmark">SIMCG</span>
    </div>

    <h1 id="login-title">Iniciar sesión</h1>
    <p class="card__subtitle">Sistema de Servidores Públicos</p>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate autocomplete="off">
      <label class="field">
        <span class="field__label">Correo electrónico</span>
        <span class="field__control" [class.field__control--error]="invalid('email')">
          <svg
            class="field__icon"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
          >
            <rect
              x="3.5"
              y="5"
              width="17"
              height="14"
              rx="2.2"
              stroke="currentColor"
              stroke-width="1.6"
            />
            <path
              d="M7.5 9.5h5M7.5 12.5h7M7.5 15.5h4"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
            />
          </svg>
          <input
            id="email"
            type="email"
            formControlName="email"
            autocomplete="off"
            placeholder="correo@ejemplo.com"
            spellcheck="false"
            maxlength="191"
            (input)="clearAuthError()"
            [attr.aria-invalid]="invalid('email')"
          />
        </span>
        @if (form.controls.email.touched && form.controls.email.errors) {
          <span class="field__error" role="alert">
            {{
              form.controls.email.hasError('required')
                ? 'El correo es obligatorio.'
                : 'Ingresa un correo válido, por ejemplo nombre@dominio.com.'
            }}
          </span>
        }
      </label>

      <label class="field">
        <span class="field__label">Contraseña</span>
        <span class="field__control" [class.field__control--error]="invalid('password')">
          <svg
            class="field__icon"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
          >
            <rect
              x="5"
              y="10.5"
              width="14"
              height="9"
              rx="2"
              stroke="currentColor"
              stroke-width="1.6"
            />
            <path d="M8 10.5V8a4 4 0 0 1 8 0v2.5" stroke="currentColor" stroke-width="1.6" />
          </svg>
          <input
            id="password"
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password"
            autocomplete="new-password"
            placeholder="••••••••"
            (input)="clearAuthError()"
            [attr.aria-invalid]="invalid('password')"
          />
          <button
            type="button"
            class="field__toggle"
            (click)="togglePassword()"
            [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          >
            @if (showPassword()) {
              <svg
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
                aria-hidden="true"
              >
                <path
                  d="M3 3l18 18M10.6 10.7a2.5 2.5 0 0 0 3.5 3.4M7.4 7.5C5.3 8.9 3.7 10.9 3 12c1.6 2.9 5 7 9 7 1.5 0 2.9-.4 4.1-1.1M16.8 16.9C18.7 15.5 20.2 13.6 21 12c-1.7-3-5-7-9-7-.9 0-1.7.1-2.5.4"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            } @else {
              <svg
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
                aria-hidden="true"
              >
                <path
                  d="M3 12c1.7-3 5-7 9-7s7.3 4 9 7c-1.7 3-5 7-9 7s-7.3-4-9-7Z"
                  stroke="currentColor"
                  stroke-width="1.6"
                />
                <circle cx="12" cy="12" r="2.6" stroke="currentColor" stroke-width="1.6" />
              </svg>
            }
          </button>
        </span>
        @if (form.controls.password.touched && form.controls.password.hasError('required')) {
          <span class="field__error" role="alert">La contraseña es obligatoria.</span>
        }
      </label>

      @if (authMessage()) {
        <div class="auth-error" role="alert">{{ authMessage() }}</div>
      }

      <button type="submit" class="submit" [disabled]="loading() || form.invalid || success()">
        @if (loading()) {
          <span class="spinner" aria-hidden="true"></span>
          <span>Verificando…</span>
        } @else {
          <span>Entrar</span>
        }
      </button>
    </form>
  </div>

  <p class="stage__footer">© 2026 Congreso del Estado de México · SIMCG</p>
</main>
