<div class="toast-stack">
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      class="toast"
      [attr.data-tipo]="toast.tipo"
      [attr.role]="toast.tipo === 'error' ? 'alert' : 'status'"
      [attr.aria-live]="toast.tipo === 'error' ? 'assertive' : 'polite'"
      animate.enter="toast-entrada"
      animate.leave="toast-salida"
      (mouseenter)="toastService.pausar(toast.id)"
      (mouseleave)="toastService.reanudar(toast.id)"
      (focusin)="toastService.pausar(toast.id)"
      (focusout)="toastService.reanudar(toast.id)"
    >
      <span class="toast__icon" aria-hidden="true">
        <app-icono [nombre]="toast.tipo === 'success' ? 'check' : 'alerta'" />
      </span>
      <span class="toast__mensaje">{{ toast.mensaje }}</span>
      @if (toast.accion; as accion) {
        <button type="button" class="toast__accion" (click)="ejecutarAccion(toast.id, accion)">
          {{ accion.etiqueta }}
        </button>
      }
      <button
        type="button"
        class="toast__cerrar"
        (click)="toastService.dismiss(toast.id)"
        aria-label="Cerrar aviso"
      >
        <app-icono nombre="cerrar" />
      </button>
    </div>
  }
</div>
